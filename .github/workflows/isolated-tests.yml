name: Isolated tests (no production credentials)
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: kisa_ci
          POSTGRES_USER: kisa_ci
          POSTGRES_PASSWORD: isolated_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kisa_ci -d kisa_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://kisa_ci:isolated_ci_only@localhost:5432/kisa_ci
      PGSSLMODE: disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Bootstrap disposable PostgreSQL schema
        run: node scripts/bootstrap-ci-db.mjs
      - name: Test against disposable PostgreSQL
        run: npm test
      - name: Verify production image builds without DATABASE_URL
        run: |
          docker build --tag kisa-ci:${{ github.sha }} .
