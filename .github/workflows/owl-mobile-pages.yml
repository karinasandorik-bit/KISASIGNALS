name: OWL Mobile Pages
on:
  push:
    branches: [main]
    paths:
      - 'owl-mobile/**'
      - '.github/workflows/owl-mobile-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: owl-mobile-pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: owl-mobile
      - id: deployment
        uses: actions/deploy-pages@v4
