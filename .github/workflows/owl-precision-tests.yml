name: OWL precision fault-injection
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/precision-outbox.mjs'
      - 'src/live.mjs'
      - 'src/signal-push.mjs'
      - 'tests/precision-outbox.test.mjs'
      - '.github/workflows/owl-precision-tests.yml'
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: test_only
          POSTGRES_DB: owl_precision_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d owl_precision_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      OWL_TEST_DATABASE_URL: postgresql://postgres:test_only@127.0.0.1:5432/owl_precision_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --check src/precision-outbox.mjs
      - run: node --check src/live.mjs
      - run: node --check src/signal-push.mjs
      - run: node --test tests/precision-outbox.test.mjs
