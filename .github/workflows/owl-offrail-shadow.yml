name: OWL off-Railway shadow (research only)
on:
  workflow_dispatch:
  schedule:
    - cron: '7,17,27,37,47,57 * * * *'
permissions:
  contents: write
concurrency:
  group: owl-offrail-ledger
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Collect and create prospective research decision
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '7 * * * *'
        run: python3 offrail/runner.py decide
      - name: Settle eligible prior decisions
        run: python3 offrail/runner.py settle
      - name: Persist nonsecret audit ledger
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add offrail/ledger
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "audit: prospective OWL shadow snapshot/decision/settlement"
          git push origin HEAD:${GITHUB_REF_NAME}
